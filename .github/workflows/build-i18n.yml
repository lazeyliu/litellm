name: 构建 LiteLLM 国际化镜像

on:
  workflow_dispatch:
    inputs:
      litellm_version:
        description: 'LiteLLM 官方版本 Tag (如 v1.99.1)'
        required: true
        default: 'v1.99.1'
      ui_lang:
        description: 'UI 语言'
        required: true
        default: 'zh-CN'
        type: choice
        options:
          - en
          - ja
          - ko
          - zh-CN
          - zh-TW
      upstream_tag:
        description: '上游 litellm-zhtw Release Tag (填 latest 自动获取最新)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: litellm-i18n

jobs:
  构建并推送:
    name: 构建镜像并推送到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出 LiteLLM 官方源码
        uses: actions/checkout@v4
        with:
          repository: BerriAI/litellm
          ref: ${{ github.event.inputs.litellm_version || 'v1.99.1' }}
          path: litellm-src

      - name: 解析上游 i18n Release Tag
        id: upstream
        run: |
          set -e
          TAG="${{ github.event.inputs.upstream_tag || 'latest' }}"
          if [ "$TAG" = "latest" ]; then
            TAG=$(curl -sL --fail \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Sen-CaPoo/litellm-zhtw/releases/latest | \
              jq -r '.tag_name // empty')
            [ -z "$TAG" ] && { echo "::error::获取最新 release 失败"; exit 1; }
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 拉取上游国际化源码
        run: |
          set -e
          UPSTREAM_DIR=$(mktemp -d)
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" --single-branch \
            https://github.com/Sen-CaPoo/litellm-zhtw.git "$UPSTREAM_DIR"
          cp -r "$UPSTREAM_DIR/zhtw" ./litellm-src/zhtw
          rm -rf "$UPSTREAM_DIR"

      - name: 注入 i18n 补丁到 Dockerfile
        run: |
          cd litellm-src
          # 在 build_admin_ui.sh 之后插入 i18n 步骤
          sed -i '/.\/docker\/build_admin_ui.sh/a \
          \
          # ====== i18n 补丁 ======\
          ARG LITELLM_UI_LANG=zh-CN\
          COPY zhtw/ /zhtw/\
          RUN LITELLM_UI_LANG="$LITELLM_UI_LANG" python /zhtw/patch_ui.py \&\& rm -rf /zhtw\
          # ======================' docker/Dockerfile

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.litellm_version || 'v1.99.1' }}-${{ github.event.inputs.ui_lang || 'zh-CN' }}
            type=raw,value=latest-${{ github.event.inputs.ui_lang || 'zh-CN' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ./litellm-src
          file: ./litellm-src/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LITELLM_UI_LANG=${{ github.event.inputs.ui_lang || 'zh-CN' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
