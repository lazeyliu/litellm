name: 构建 LiteLLM 国际化镜像

on:
  workflow_dispatch:
    inputs:
      litellm_version:
        description: 'LiteLLM 基础镜像版本 (如 v1.99.1)'
        required: true
        default: 'v1.99.1'
      ui_lang:
        description: 'UI 语言'
        required: true
        default: 'zh-CN'
        type: choice
        options:
          - en
          - ja
          - ko
          - zh-CN
          - zh-TW
      upstream_tag:
        description: '上游 litellm-zhtw Release Tag (填 latest 自动获取最新)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: litellm-i18n

jobs:
  list-releases:
    name: 获取上游可用 Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 获取上游 Release 列表
        run: |
          echo "=== Sen-CaPoo/litellm-zhtw 可用 Release Tags ==="
          curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Sen-CaPoo/litellm-zhtw/releases?per_page=10 | \
            jq -r '.[] | "  \(.tag_name)  —  \(.published_at | split("T")[0])"' || \
            echo "获取失败，请直接访问: https://github.com/Sen-CaPoo/litellm-zhtw/releases"
          echo ""
          echo "提示: 在 'Run workflow' 时输入上方任意 tag，或输入 latest 自动使用最新版"

  build-and-push:
    name: 构建镜像并推送到 GHCR
    runs-on: ubuntu-latest
    needs: list-releases
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 解析上游 Release Tag
        id: upstream
        run: |
          set -e
          TAG="${{ github.event.inputs.upstream_tag || 'latest' }}"
          
          if [ "$TAG" = "latest" ]; then
            echo "正在获取最新 release tag..."
            TAG=$(curl -sL --fail \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Sen-CaPoo/litellm-zhtw/releases/latest | \
              jq -r '.tag_name // empty')
            
            if [ -z "$TAG" ]; then
              echo "::error::无法获取最新 release，请手动指定 tag"
              exit 1
            fi
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "使用上游 release tag: $TAG"

      - name: 拉取上游国际化源码
        id: fetch
        run: |
          set -e
          UPSTREAM_DIR=$(mktemp -d)
          TAG="${{ steps.upstream.outputs.tag }}"
          
          echo "正在克隆 tag: $TAG ..."
          git clone --depth 1 --branch "$TAG" --single-branch \
            https://github.com/Sen-CaPoo/litellm-zhtw.git "$UPSTREAM_DIR"
          
          COMMIT_SHORT=$(cd "$UPSTREAM_DIR" && git rev-parse --short HEAD)
          echo "commit=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "✅ 成功拉取: tag=$TAG, commit=$COMMIT_SHORT"
          
          cp -r "$UPSTREAM_DIR/zhtw" ./zhtw
          rm -rf "$UPSTREAM_DIR"

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.litellm_version || 'v1.99.1' }}-${{ github.event.inputs.ui_lang || 'zh-CN' }}
            type=raw,value=${{ github.event.inputs.litellm_version || 'v1.99.1' }}-${{ github.event.inputs.ui_lang || 'zh-CN' }}-upstream-${{ steps.fetch.outputs.commit }}
            type=raw,value=latest-${{ github.event.inputs.ui_lang || 'zh-CN' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LITELLM_UI_LANG=${{ github.event.inputs.ui_lang || 'zh-CN' }}
            LITELLM_VERSION=${{ github.event.inputs.litellm_version || 'v1.99.1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
