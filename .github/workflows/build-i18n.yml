name: Build LiteLLM i18n Image

on:
  schedule:
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      litellm_version:
        description: 'LiteLLM 基础镜像版本 (ghcr.io/berriai/litellm 的 tag)'
        required: true
        default: 'v1.99.1'
      ui_lang:
        description: 'UI 语言'
        required: true
        default: 'zh-CN'
        type: choice
        options:
          - en
          - ja
          - ko
          - zh-CN
          - zh-TW
      upstream_tag:
        description: '上游 litellm-zhtw 的 Release Tag (输入 latest 则自动获取最新 release)'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Resolve upstream release tag
        id: upstream
        run: |
          set -e
          TAG="${{ github.event.inputs.upstream_tag || 'latest' }}"
          
          if [ "$TAG" = "latest" ]; then
            echo "正在获取 Sen-CaPoo/litellm-zhtw 最新 release tag..."
            TAG=$(curl -sL --fail \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Sen-CaPoo/litellm-zhtw/releases/latest | \
              jq -r '.tag_name // empty')
            
            if [ -z "$TAG" ]; then
              echo "获取最新 release 失败，回退到 main"
              TAG="main"
            fi
          fi
          
          echo "使用上游 tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Fetch upstream i18n source
        id: fetch
        run: |
          set -e
          UPSTREAM_DIR=$(mktemp -d)
          TAG="${{ steps.upstream.outputs.tag }}"
          
          # 用 tag 克隆（git --branch 同时支持分支和 tag）
          git clone --depth 1 --branch "$TAG" \
            https://github.com/Sen-CaPoo/litellm-zhtw.git "$UPSTREAM_DIR"
          
          COMMIT_SHORT=$(cd "$UPSTREAM_DIR" && git rev-parse --short HEAD)
          echo "commit=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "上游代码已拉取: tag=$TAG, commit=$COMMIT_SHORT"
          
          cp -r "$UPSTREAM_DIR/zhtw" ./zhtw
          rm -rf "$UPSTREAM_DIR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.ui_lang || 'zh-CN' }}-${{ github.event.inputs.litellm_version || 'v1.99.1' }}
            type=raw,value=${{ github.event.inputs.ui_lang || 'zh-CN' }}-latest
            type=raw,value=${{ github.event.inputs.ui_lang || 'zh-CN' }}-${{ github.event.inputs.litellm_version || 'v1.99.1' }}-upstream-${{ steps.fetch.outputs.commit }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LITELLM_UI_LANG=${{ github.event.inputs.ui_lang || 'zh-CN' }}
            LITELLM_VERSION=${{ github.event.inputs.litellm_version || 'v1.99.1' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
